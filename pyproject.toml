[project]
name = "apart-assessment"
version = "0.1.0"
description = "Research work on evaluating harmful AI manipulation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.75.0",
    "inspect-ai>=0.3.260",
    "openai>=2.0.0",
    "python-dotenv>=1.0.1",
]

[project.scripts]
apart-assessment = "apart_assessment.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
